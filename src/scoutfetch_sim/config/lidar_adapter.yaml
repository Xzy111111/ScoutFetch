sim_laserscan_to_pointcloud:
  ros__parameters:
    target_frame: livox_frame
    transform_tolerance: 0.05

sim_pointcloud_to_laserscan:
  ros__parameters:
    target_frame: livox_frame
    transform_tolerance: 0.05
    min_height: -0.01
    max_height: 0.01
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.00872665
    scan_time: 0.10
    range_min: 0.05
    range_max: 70.0
    use_inf: true
    inf_epsilon: 1.0
